<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e10600" />
  <title>اختبار الدراجات النارية | مدرسة ميشال حنوش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/michologo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="quiz-brand">
        <img class="quiz-brand-logo" src="assets/michologo.png" alt="شعار مدرسة ميشال حنوش" />
        <p class="quiz-brand-name">مدرسة ميشال جوزيف حنوش<br />لتعليم قيادة السيارات</p>
      </div>

      <div id="quizView">
        <div class="header">
          <h1 class="title small">اختبار قيادة الدراجات النارية</h1>
          <div id="userName" class="sub user-name"></div>
          <div id="userPhone" class="sub user-phone"></div>
        </div>
        <div id="qCounterTop" class="counter-top"></div>
        <div id="progress" class="progress"></div>
        <div class="qbox">
          <img id="qImg" class="qimg hidden" alt="صورة السؤال" />
          <div id="qText" class="question"></div>
        </div>
        <div id="choices" class="choices"></div>
        <div id="feedback" class="feedback hidden"></div>
        <div class="actions">
          <button id="confirmBtn" class="btn btn-secondary" disabled>تأكيد الإجابة</button>
          <button id="nextBtn" class="btn btn-primary" disabled>السؤال التالي</button>
        </div>
      </div>

      <div id="resultsView" class="hidden">
        <div class="header">
          <h1 class="title small">النتيجة</h1>
          <div id="resultUser" class="sub"></div>
        </div>
        <div id="scoreBox" class="score-box"></div>
        <div class="results-actions">
          <button id="retryBtn" class="btn btn-primary">إعادة اختبار (30 سؤال)</button>
          <button id="homeBtn" class="btn btn-secondary">الرجوع للرئيسية</button>
        </div>
        <div id="reviewList" class="review-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© 2026 مدرسة ميشال حنوش</span><span class="footer-separator">•</span>
    <span>Designed & developed by MAJD MOUHAMMAD</span><span class="footer-separator">•</span>
    <a class="phone-line" href="tel:+96181342594">81 342 594</a>
  </footer>

  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "app.js?v=" + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
