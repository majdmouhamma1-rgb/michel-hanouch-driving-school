<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color"
        content="#e10600">

  <title>اختبار قيادة السيارات خصوصي | مدرسة ميشال حنوش</title>

  <!-- Google Font -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- Logo -->
  <link rel="icon"
        type="image/png"
        href="assets/michologo.png">

  <!-- Main CSS -->
  <link rel="stylesheet"
        href="style.css">


  <!-- TIMER CSS -->
  <style>

    .quiz-timer-container {
      display: flex;
      justify-content: center;
      align-items: center;

      margin: 15px 0 20px;
    }


    .quiz-timer {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      min-width: 135px;

      padding: 10px 22px;

      background: #e10600;

      color: white;

      border-radius: 30px;

      font-family: "Cairo", sans-serif;

      font-size: 22px;

      font-weight: 900;

      box-shadow:
        0 5px 18px rgba(225, 6, 0, 0.30);

      transition: 0.3s;
    }


    .quiz-timer-icon {
      font-size: 21px;
    }


    #quizTimer {
      direction: ltr;
      font-variant-numeric: tabular-nums;
    }


    /* LAST 2 MINUTES */

    .quiz-timer.warning {
      background: #ff8c00;

      animation:
        timerPulse 1s infinite;
    }


    /* LAST MINUTE */

    .quiz-timer.danger {
      background: #c40000;

      animation:
        timerPulse 0.6s infinite;
    }


    @keyframes timerPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }

      100% {
        transform: scale(1);
      }

    }


    @media (max-width: 600px) {

      .quiz-timer {
        min-width: 120px;

        padding: 8px 18px;

        font-size: 19px;
      }

    }

  </style>

</head>


<body>


  <main class="page">


    <section class="card">


      <!-- ================================= -->
      <!-- SCHOOL LOGO -->
      <!-- ================================= -->

      <div class="quiz-brand">

        <img
          class="quiz-brand-logo"
          src="assets/michologo.png"
          alt="شعار مدرسة ميشال حنوش"
        >

        <p class="quiz-brand-name">

          مدرسة ميشال جوزيف حنوش

          <br>

          لتعليم قيادة السيارات

        </p>

      </div>



      <!-- ================================= -->
      <!-- LANGUAGE SELECTION -->
      <!-- ================================= -->

      <div
        id="languageView"
        class="language-view"
      >


        <div class="header">

          <h1 class="title small">

            اختر لغة الاختبار

          </h1>


          <div class="sub">

            Choose your language
            ·
            Choisissez votre langue

          </div>

        </div>



        <div class="language-actions">


          <!-- ARABIC -->

          <button
            type="button"
            class="btn btn-primary language-btn"
            data-lang="ar"
          >

            العربية

          </button>



          <!-- ENGLISH -->

          <button
            type="button"
            class="btn btn-primary language-btn"
            data-lang="en"
          >

            English

          </button>



          <!-- FRENCH -->

          <button
            type="button"
            class="btn btn-primary language-btn"
            data-lang="fr"
          >

            Français

          </button>


        </div>



        <div class="results-actions language-home-action">


          <button
            type="button"
            id="languageHomeBtn"
            class="btn btn-secondary"
          >

            الرجوع للرئيسية

          </button>


        </div>


      </div>



      <!-- ================================= -->
      <!-- ACTUAL QUIZ -->
      <!-- ================================= -->

      <div
        id="quizView"
        class="hidden"
      >


        <!-- QUIZ HEADER -->

        <div class="header">


          <h1
            id="quizTitle"
            class="title small"
          >

            اختبار قيادة السيارات خصوصي

          </h1>


          <div
            id="userName"
            class="sub user-name"
          >

            مدرسة ميشال جوزيف حنوش

          </div>


          <div
            id="userPhone"
            class="sub user-phone"
          >

            03 467 094

          </div>


        </div>



        <!-- ================================= -->
        <!-- LIVE 15 MINUTE TIMER -->
        <!-- ================================= -->

        <div class="quiz-timer-container">


          <div
            id="quizTimerBox"
            class="quiz-timer"
          >


            <span
              class="quiz-timer-icon"
              aria-hidden="true"
            >

              ⏱

            </span>


            <span id="quizTimer">

              15:00

            </span>


          </div>


        </div>



        <!-- ================================= -->
        <!-- QUESTION NUMBER -->
        <!-- ================================= -->

        <div
          id="qCounterTop"
          class="counter-top"
        >

          السؤال 1 من 30

        </div>



        <!-- ================================= -->
        <!-- PROGRESS BAR -->
        <!-- ================================= -->

        <div
          id="progress"
          class="progress"
        ></div>



        <!-- ================================= -->
        <!-- QUESTION -->
        <!-- ================================= -->

        <div class="qbox">


          <!-- QUESTION IMAGE -->

          <img
            id="qImg"
            class="qimg hidden"
            alt="question image"
          >


          <!-- QUESTION TEXT -->

          <div
            id="qText"
            class="question"
          ></div>


        </div>



        <!-- ================================= -->
        <!-- ANSWER CHOICES -->
        <!-- ================================= -->

        <div
          id="choices"
          class="choices"
        ></div>



        <!-- ================================= -->
        <!-- FEEDBACK -->
        <!-- ================================= -->

        <div
          id="feedback"
          class="feedback hidden"
        ></div>



        <!-- ================================= -->
        <!-- QUIZ BUTTONS -->
        <!-- ================================= -->

        <div class="actions">


          <!-- CONFIRM -->

          <button
            type="button"
            id="confirmBtn"
            class="btn btn-secondary"
            disabled
          >

            تأكيد الإجابة

          </button>



          <!-- NEXT -->

          <button
            type="button"
            id="nextBtn"
            class="btn btn-primary"
            disabled
          >

            السؤال التالي

          </button>


        </div>


      </div>



      <!-- ================================= -->
      <!-- RESULTS -->
      <!-- ================================= -->

      <div
        id="resultsView"
        class="hidden"
      >


        <div class="header">


          <h1
            id="resultTitle"
            class="title small"
          >

            النتيجة

          </h1>


          <div
            id="resultUser"
            class="sub"
          ></div>


        </div>



        <!-- SCORE -->

        <div
          id="scoreBox"
          class="score-box"
        ></div>



        <!-- RESULT BUTTONS -->

        <div class="results-actions">


          <!-- RETRY -->

          <button
            type="button"
            id="retryBtn"
            class="btn btn-primary"
          >

            إعادة اختبار (30 سؤال)

          </button>



          <!-- CHANGE LANGUAGE -->

          <button
            type="button"
            id="changeLangBtn"
            class="btn btn-secondary"
          >

            تغيير اللغة

          </button>



          <!-- HOME -->

          <button
            type="button"
            id="homeBtn"
            class="btn btn-secondary"
          >

            الرجوع للرئيسية

          </button>


        </div>



        <!-- ================================= -->
        <!-- ANSWER REVIEW -->
        <!-- ================================= -->

        <div
          id="reviewList"
          class="review-list"
        ></div>


      </div>


    </section>


  </main>

</body>

</html>
